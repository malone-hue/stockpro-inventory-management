<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | StockPro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="main-content" style="margin-left: 0; max-width: 900px; margin-right: auto;">
        <header class="topbar">
            <div>
                <h1>Edit Product</h1>
                <p>Update the details for {{ product.name }}.</p>
            </div>
            <a href="/" class="button secondary">Back to Dashboard</a>
        </header>

```
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="notice {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <section class="products-section">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="name">Product Name</label>
            <input id="name" name="name" type="text" maxlength="150"
                   value="{{ product.name }}" required>

            <label for="category">Category</label>
            <input id="category" name="category" type="text" maxlength="100"
                   value="{{ product.category }}" required>

            <label for="cost_price">Cost Price</label>
            <input id="cost_price" name="cost_price" type="number"
                   min="0" step="0.01" value="{{ product.cost_price }}" required>

            <label for="selling_price">Selling Price</label>
            <input id="selling_price" name="selling_price" type="number"
                   min="0" step="0.01" value="{{ product.selling_price }}" required>

            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number"
                   min="0" step="1" value="{{ product.quantity }}" required>

            <label for="reorder_level">Low Stock Alert Level</label>
            <input id="reorder_level" name="reorder_level" type="number"
                   min="0" step="1" value="{{ product.reorder_level }}" required>

            <button class="button" type="submit">Save Changes</button>
        </form>
    </section>
</main>
```

</body>
</html>
